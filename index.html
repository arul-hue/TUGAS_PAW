<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemrograman Web | Beranda</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #243247;
        background: #f4f7fb;
      }

      header {
        padding: 28px 20px;
        color: #ffffff;
        background: #205b91;
      }

      .container {
        width: min(100% - 32px, 960px);
        margin: 0 auto;
      }

      header h1 {
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        margin-bottom: 4px;
      }

      header p {
        color: #e2edf8;
      }

      main {
        padding: 42px 0;
      }

      .intro {
        margin-bottom: 24px;
      }

      .intro h2 {
        font-size: 1.4rem;
        margin-bottom: 6px;
      }

      .task-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .task-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #dce5ef;
        border-radius: 12px;
      }

      .task-card h3 {
        margin-bottom: 8px;
        color: #205b91;
      }

      .task-card p {
        margin-bottom: 20px;
        color: #526174;
      }

      .task-link {
        display: inline-block;
        margin-top: auto;
        padding: 10px 16px;
        color: #ffffff;
        background: #205b91;
        border-radius: 7px;
        text-decoration: none;
      }

      .task-link:hover,
      .task-link:focus {
        background: #17446e;
      }

      footer {
        padding: 18px 16px;
        color: #607086;
        text-align: center;
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        main {
          padding: 28px 0;
        }

        .task-list {
          grid-template-columns: 1fr;
        }

        .task-card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Pemrograman Web</h1>
        <p>Halaman utama kumpulan tugas</p>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <h2>Daftar Tugas</h2>
        <p>Pilih tugas yang ingin dibuka melalui tautan di bawah ini.</p>
      </section>

      <section class="task-list" aria-label="Daftar folder tugas">
        <article class="task-card">
          <h3>Tugas 2</h3>
          <p>Buka halaman dan file tugas <strong>task_2</strong>.</p>
          <a class="task-link" href="./task_2/">Buka Tugas 2</a>
        </article>

        <article class="task-card">
          <h3>Tugas Individu 3</h3>
          <p>Buka halaman dan file tugas <strong>task_3</strong>.</p>
          <a class="task-link" href="./task_3/">Buka Tugas 3</a>
        </article>
      </section>
    </main>

    <footer>
      <div class="container">Pemrograman Web</div>
    </footer>
  </body>
</html>
